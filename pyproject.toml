[project]
name = "stage2-research-assistant"
version = "0.1.0"
description = "Stage 2 research assistant: tools, RAG, memory, and citations"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "croniter>=2.0.0",
    "fastapi>=0.104.0",
    "httpx>=0.27.0",
    "litellm>=1.81.13,<1.82",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "uvicorn[standard]>=0.24.0",
    "watchdog>=3.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
channels = [
    "discord.py>=2.0",
    "python-telegram-bot>=20.0",
]
crawl = ["crawl4ai>=0.3.0"]
semantic-rag = [
    "qdrant-client>=1.15.0",
    "sentence-transformers>=5.0.0",
]
observability = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "opentelemetry-exporter-prometheus>=0.51b0",
    "opentelemetry-sdk>=1.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mybot", "src/research_assistant"]

[project.scripts]
my-bot = "mybot.cli.main:app"
research-assistant = "research_assistant.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
