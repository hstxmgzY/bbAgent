llm:
  provider: openai
  model: openai/gpt-4.1-mini
  api_key: ${OPENAI_API_KEY}
  temperature: 0.2
  max_tokens: 2048

default_agent: assistant

channels:
  enabled: false

api:
  host: 127.0.0.1
  port: 8000
  # websocket_auth_secret signs each source with HMAC-SHA256 before push is enabled.
  # websocket_auth_secret: ${MYBOT_WS_AUTH_SECRET}

dispatch:
  store_url: sqlite:///.event/dispatch.db
  scan_interval_seconds: 1
  lease_seconds: 60
  default_execution_timeout_seconds: 3600
  sync_wait_seconds: 20
  cancel_on_sync_timeout: false
  max_pending_jobs_per_session: 10
  max_queued_jobs_per_agent: 100
  max_result_bytes: 1048576
  job_retention_hours: 168
  poll_min_interval_seconds: 5
  outbox_max_attempts: 20

research:
  embedding:
    provider: hashing
    model: BAAI/bge-m3
    batch_size: 32
    normalize: true
  vector_store:
    provider: in_memory
    mode: local
    path: .research/qdrant
  metadata_store:
    url: sqlite:///.research/research.db
  retrieval:
    candidate_k: 30
    top_k: 8
    max_per_source: 2
  memory:
    enabled: true
    max_related_runs: 5
    default_ttl_hours: 168
    official_ttl_hours: 720
    volatile_ttl_hours: 6
  citation_evaluation:
    enabled: true
    verifier: rules
    min_coverage: 0.85
    min_support_rate: 0.80
    max_repairs: 1
  telemetry:
    enabled: true
    service_name: mybot-research
